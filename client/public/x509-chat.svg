<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f0d"/>
      <stop offset="100%" stop-color="#0a1210"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glowx" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="softx" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgx)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <circle cx="330" cy="300" r="260" fill="url(#glowx)"/>

  <!-- CA / root node with cert lines to authorized clients -->
  <g filter="url(#softx)">
    <g stroke="url(#shieldGrad)" stroke-width="1.4" opacity="0.55">
      <line x1="330" y1="300" x2="470" y2="215"/>
      <line x1="330" y1="300" x2="470" y2="300"/>
      <line x1="330" y1="300" x2="470" y2="390"/>
      <line x1="330" y1="300" x2="200" y2="180"/>
    </g>
    <g stroke="#ef4444" stroke-width="1.4" stroke-dasharray="2 6" opacity="0.45">
      <line x1="330" y1="300" x2="180" y2="420"/>
    </g>
  </g>

  <!-- shield (certificate authority) -->
  <g transform="translate(280,240)">
    <path d="M50,0 L96,16 L96,58 C96,92 75,112 50,124 C25,112 4,92 4,58 L4,16 Z"
          fill="#0f1a17" stroke="url(#shieldGrad)" stroke-width="3"/>
    <path d="M32,64 L45,78 L70,44" fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- authorized client nodes -->
  <g fill="#67e8f9">
    <circle cx="470" cy="215" r="6"/>
    <circle cx="470" cy="300" r="6"/>
    <circle cx="470" cy="390" r="6"/>
    <circle cx="200" cy="180" r="6"/>
  </g>
  <g fill="none" stroke="#a7f3d0" stroke-width="2">
    <circle cx="470" cy="215" r="12"/>
    <circle cx="470" cy="300" r="12"/>
    <circle cx="470" cy="390" r="12"/>
    <circle cx="200" cy="180" r="12"/>
  </g>

  <!-- denied client node -->
  <g>
    <circle cx="180" cy="420" r="6" fill="#ef4444"/>
    <circle cx="180" cy="420" r="12" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.7"/>
    <line x1="172" y1="412" x2="188" y2="428" stroke="#ef4444" stroke-width="2"/>
    <line x1="188" y1="412" x2="172" y2="428" stroke="#ef4444" stroke-width="2"/>
  </g>

  <!-- chat bubbles near authorized nodes -->
  <g fill="#0f1a17" stroke="#22d3ee" stroke-width="1.5" opacity="0.8">
    <rect x="600" y="195" width="70" height="40" rx="8"/>
    <path d="M614,235 L614,248 L628,235 Z"/>
    <rect x="600" y="280" width="70" height="40" rx="8"/>
    <path d="M614,320 L614,333 L628,320 Z"/>
  </g>
  <g stroke="#a7f3d0" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round">
    <line x1="612" y1="211" x2="658" y2="211"/>
    <line x1="612" y1="221" x2="645" y2="221"/>
    <line x1="612" y1="296" x2="658" y2="296"/>
    <line x1="612" y1="306" x2="645" y2="306"/>
  </g>

  <text x="40" y="70" font-family="monospace" font-size="13" fill="#a7f3d0" opacity="0.55">CA → signed cert → mutual TLS → authorized chat</text>
</svg>
