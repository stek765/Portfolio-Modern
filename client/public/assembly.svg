<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="chipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Pins -->
  <g stroke="#666" stroke-width="8" stroke-linecap="round">
    <!-- Top -->
    <line x1="128" y1="64" x2="128" y2="32" />
    <line x1="192" y1="64" x2="192" y2="32" />
    <line x1="256" y1="64" x2="256" y2="32" />
    <line x1="320" y1="64" x2="320" y2="32" />
    <line x1="384" y1="64" x2="384" y2="32" />
    
    <!-- Bottom -->
    <line x1="128" y1="448" x2="128" y2="480" />
    <line x1="192" y1="448" x2="192" y2="480" />
    <line x1="256" y1="448" x2="256" y2="480" />
    <line x1="320" y1="448" x2="320" y2="480" />
    <line x1="384" y1="448" x2="384" y2="480" />

    <!-- Left -->
    <line x1="64" y1="128" x2="32" y2="128" />
    <line x1="64" y1="192" x2="32" y2="192" />
    <line x1="64" y1="256" x2="32" y2="256" />
    <line x1="64" y1="320" x2="32" y2="320" />
    <line x1="64" y1="384" x2="32" y2="384" />

    <!-- Right -->
    <line x1="448" y1="128" x2="480" y2="128" />
    <line x1="448" y1="192" x2="480" y2="192" />
    <line x1="448" y1="256" x2="480" y2="256" />
    <line x1="448" y1="320" x2="480" y2="320" />
    <line x1="448" y1="384" x2="480" y2="384" />
  </g>

  <!-- Body -->
  <rect x="64" y="64" width="384" height="384" rx="48" fill="url(#chipGradient)" stroke="#555" stroke-width="4" />
  
  <!-- Inner Detail -->
  <rect x="128" y="128" width="256" height="256" rx="16" fill="none" stroke="#333" stroke-width="4" />
  
  <!-- Text -->
  <text x="256" y="295" font-family="monospace" font-size="100" fill="#aaa" text-anchor="middle" font-weight="bold" letter-spacing="4">ASM</text>
</svg>